<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Catalogue+ Local{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    color: #1a1a1a;
  }
  header {
    background: #1a1a2e;
    color: #fff;
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  header a {
    color: #fff;
    text-decoration: none;
    font-weight: 600;
  }
  header .badge {
    background: #22c55e;
    color: #06240f;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
  }
  nav a {
    margin-left: 16px;
    opacity: 0.85;
  }
  main {
    max-width: 800px;
    margin: 24px auto;
    padding: 0 16px;
  }
  .flash {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 16px;
    font-weight: 500;
  }
  .flash.success { background: #dcfce7; color: #14532d; }
  .flash.error { background: #fee2e2; color: #7f1d1d; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .card h3 { margin: 0 0 4px 0; font-size: 17px; }
  .card p { margin: 0; color: #555; font-size: 14px; }
  .tag {
    display: inline-block;
    font-size: 12px;
    background: #eef2ff;
    color: #4338ca;
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .btn {
    display: inline-block;
    background: #4f46e5;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    font-size: 14px;
  }
  .btn.secondary {
    background: #fff;
    color: #4f46e5;
    border: 2px solid #4f46e5;
  }
  .btn.disabled {
    background: #d1d5db;
    color: #6b7280;
    pointer-events: none;
  }
  .btn.danger {
    background: #dc2626;
  }
  form.search {
    margin-bottom: 20px;
    display: flex;
    gap: 8px;
  }
  form.search input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid #ddd;
    font-size: 15px;
  }
  label { font-weight: 600; display: block; margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 15px;
    margin-bottom: 16px;
  }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .section-header h2 { margin: 0; font-size: 19px; }
  .tag-attente {
    background: #fef3c7;
    color: #92400e;
    margin-left: 6px;
  }
  .inline-form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .inline-form input {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
    max-width: 160px;
    margin-bottom: 0;
  }
  .contact-link {
    color: #4f46e5;
    text-decoration: none;
    font-weight: 600;
  }
  .contact-link:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<header>
  <div><a href="{{ url_for('index') }}">Catalogue+ Local</a> <span class="badge">Mode hors ligne</span></div>
  <nav>
    <a href="{{ url_for('index') }}">Catalogue</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
